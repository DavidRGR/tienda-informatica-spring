<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="${titulo} + ' | TiendaPC'">TiendaPC</title>
	<!-- Accedemos a los estilos de Bootstrap 5 al igual que a los nuestros propios -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" th:href="@{/css/estilos.css}">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>

<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
	<div class="container">
		<a class="navbar-brand fw-bold" th:href="@{/}">
			<i class="bi bi-pc-display-horizontal"></i> Tienda<span class="texto-tienda">PC</span>
		</a>
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse"
				data-bs-target="#menuPrincipal" aria-label="Abrir menú">
			<span class="navbar-toggler-icon"></span>
		</button>

		<div class="collapse navbar-collapse" id="menuPrincipal">

			<!-- Categorías dinámicas -->
			<ul class="navbar-nav me-auto">
				<li class="nav-item dropdown" th:each="cat : ${categorias}">
					<a class="nav-link dropdown-toggle" href="#" role="button"
					   data-bs-toggle="dropdown" th:text="${cat.nombre}">Categoría</a>
					<ul class="dropdown-menu">
						<li>
							<a class="dropdown-item fw-semibold"
							   th:href="@{/articulos(categoria=${cat.idCategoria})}"
							   th:text="'Todo en ' + ${cat.nombre}">Todo</a>
						</li>
						<li th:if="${!cat.subcategorias.isEmpty()}"><hr class="dropdown-divider"></li>
						<li th:each="sub : ${cat.subcategorias}">
							<a class="dropdown-item"
							   th:href="@{/articulos(subcategoria=${sub.idSubcategoria})}"
							   th:text="${sub.nombre}">Subcategoría</a>
						</li>
					</ul>
				</li>
			</ul>

			<!-- Zona de usuario -->
			<ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
				<li class="nav-item" th:if="${esAdmin}">
					<a class="nav-link" th:href="@{/admin}"><i class="bi bi-gear"></i> Administración</a>
				</li>
				<li class="nav-item" th:if="${esComprador}">
					<a class="nav-link" th:href="@{/carrito}"><i class="bi bi-cart3"></i> Carrito</a>
				</li>
				<li class="nav-item" th:if="${autenticado}">
					<span class="navbar-text small" th:text="${nombreUsuario}">usuario</span>
				</li>
				<li class="nav-item" th:if="${autenticado}">
					<form th:action="@{/logout}" method="post">
						<button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
					</form>
				</li>
				<li class="nav-item" th:unless="${autenticado}">
					<a class="btn btn-tienda btn-sm" th:href="@{/login}">Iniciar sesión</a>
				</li>
			</ul>
		</div>
	</div>
</nav>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
