<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Compra realizada')}"></head>

<body>
<nav th:replace="~{fragments/base :: navbar}"></nav>

<main class="container my-4">
	<div th:if="${aviso}" class="alert alert-success" th:text="${aviso}"></div>
	<div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

	<div class="text-center mb-4">
		<th:block th:if="${compra.estado.name() == 'CANCELADA'}">
			<i class="bi bi-x-circle-fill display-3 text-danger"></i>
			<h1 class="h3 fw-bold mt-2">Compra cancelada</h1>
			<p class="text-muted mb-1">Los artículos han vuelto al stock. Es una simulación: no hay ningún reembolso real.</p>
		</th:block>
		<th:block th:unless="${compra.estado.name() == 'CANCELADA'}">
			<i class="bi bi-check-circle-fill display-3 text-success"></i>
			<h1 class="h3 fw-bold mt-2">¡Gracias por tu compra!</h1>
		</th:block>
		<p class="text-muted mb-0">
			Pedido nº <strong th:text="${compra.idCompra}">1</strong> ·
			<span th:text="${#temporals.format(compra.fecha, 'dd/MM/yyyy HH:mm')}">fecha</span> ·
			<span th:text="${compra.estado}">PAGADA</span>
		</p>
	</div>

	<div class="table-responsive">
		<table class="table align-middle">
			<thead>
			<tr>
				<th colspan="2">Artículo</th>
				<th>Precio</th>
				<th>Cantidad</th>
				<th class="text-end">Subtotal</th>
			</tr>
			</thead>
			<tbody>
			<tr th:each="l : ${lineas}">
				<td style="width: 90px">
					<img th:src="@{${l.src()}}" th:alt="${l.nombre()}" class="carrito-img"
						 onerror="this.onerror=null; this.src='/img/sin-imagen.svg'">
				</td>
				<td>
					<div class="tarjeta-marca" th:text="${l.marca()}">MARCA</div>
					<span class="fw-semibold" th:text="${l.nombre()}">Nombre</span>
				</td>
				<td th:text="${#numbers.formatDecimal(l.precioUnitario(), 1, 'POINT', 2, 'COMMA')} + ' €'">0 €</td>
				<td th:text="${l.cantidad()}">1</td>
				<td class="text-end"
					th:text="${#numbers.formatDecimal(l.subtotal(), 1, 'POINT', 2, 'COMMA')} + ' €'">0 €</td>
			</tr>
			</tbody>
			<tfoot>
			<tr>
				<td colspan="4" class="text-end fw-bold">Total</td>
				<td class="text-end detalle-precio fs-5"
					th:text="${#numbers.formatDecimal(compra.total, 1, 'POINT', 2, 'COMMA')} + ' €'">0 €</td>
			</tr>
			</tfoot>
		</table>
	</div>

	<div class="text-center mt-4 d-flex justify-content-center gap-2">
		<a th:href="@{/compras}" class="btn btn-outline-secondary px-4">Mis compras</a>
		<form th:if="${compra.estado.name() == 'PAGADA'}" th:action="@{/compras/{id}/cancelar(id=${compra.idCompra})}"
			  method="post" class="d-inline"
			  onsubmit="return confirm('¿Cancelar esta compra? Los artículos volverán al stock.')">
			<button type="submit" class="btn btn-outline-danger px-4">Cancelar compra</button>
		</form>
		<a th:href="@{/articulos}" class="btn btn-tienda px-4">Seguir comprando</a>
	</div>
</main>

<footer th:replace="~{fragments/base :: pie}"></footer>
<script th:replace="~{fragments/base :: scripts}"></script>
</body>
</html>
